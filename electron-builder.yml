appId: com.novelworkshop.app
productName: Novel Workshop
directories:
  output: dist
  buildResources: build
files:
  - electron/**/*
  - dist-renderer/**/*
  - node_modules/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
