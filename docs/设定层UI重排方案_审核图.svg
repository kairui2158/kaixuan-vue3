<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f4f6f8; }
      .panel { fill: #ffffff; stroke: #d8dee6; stroke-width: 2; }
      .header { fill: #202b3a; }
      .headerText { fill: #ffffff; font: 700 24px Arial, "Microsoft YaHei", sans-serif; }
      .title { fill: #172131; font: 700 30px Arial, "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #596779; font: 400 17px Arial, "Microsoft YaHei", sans-serif; }
      .label { fill: #243244; font: 700 18px Arial, "Microsoft YaHei", sans-serif; }
      .small { fill: #607084; font: 400 15px Arial, "Microsoft YaHei", sans-serif; }
      .tiny { fill: #6f7e90; font: 400 13px Arial, "Microsoft YaHei", sans-serif; }
      .muted { fill: #f0f2f5; stroke: #cbd3dd; stroke-width: 2; }
      .control { fill: #edf3f8; stroke: #b9c8d8; stroke-width: 2; }
      .content { fill: #edf6f1; stroke: #b9d5c4; stroke-width: 2; }
      .bad { fill: #fff0ee; stroke: #e5aaa3; stroke-width: 2; }
      .good { fill: #e9f5ef; stroke: #9ac9ae; stroke-width: 2; }
      .blue { fill: #2f73b7; }
      .green { fill: #2f8a5b; }
      .orange { fill: #c7792d; }
      .white { fill: #ffffff; font: 700 15px Arial, "Microsoft YaHei", sans-serif; }
      .line { stroke: #8c9aaa; stroke-width: 2; }
      .dash { stroke: #c17d55; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .overlay { fill: #1a2633; opacity: 0.14; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7c8b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text x="70" y="58" class="title">生成流水线 · 设定层 UI 重排审核图</text>
  <text x="70" y="91" class="subtitle">目标：释放正文设定区高度，让生成状态可查看但不长期挤压内容</text>

  <rect x="70" y="125" width="700" height="790" rx="8" class="panel"/>
  <rect x="70" y="125" width="700" height="58" rx="8" class="header"/>
  <text x="98" y="162" class="headerText">现状：生成后空间被多层固定区域切碎</text>

  <rect x="98" y="208" width="644" height="56" rx="5" class="muted"/>
  <text x="122" y="242" class="label">设定层</text>
  <text x="620" y="242" class="tiny">占用一整行</text>

  <rect x="98" y="280" width="644" height="66" rx="5" class="control"/>
  <text x="122" y="307" class="small">SKILL 选择器</text>
  <rect x="122" y="316" width="210" height="23" rx="3" fill="#ffffff" stroke="#b9c8d8"/>
  <text x="136" y="333" class="tiny">选择设定提取 SKILL</text>
  <text x="620" y="318" class="tiny">第一行</text>

  <rect x="98" y="362" width="644" height="66" rx="5" class="control"/>
  <text x="122" y="389" class="small">已选择 SKILL</text>
  <rect x="122" y="398" width="250" height="23" rx="12" fill="#dbeaf7" stroke="#9ebbd4"/>
  <text x="139" y="415" class="tiny">设定提取 · ×</text>
  <text x="620" y="400" class="tiny">第二行</text>

  <rect x="98" y="444" width="644" height="300" rx="5" class="bad"/>
  <text x="122" y="475" class="label">设定内容区</text>
  <text x="122" y="502" class="small">生成后卡片被压缩，标题、字段和内容容易重叠</text>
  <rect x="122" y="524" width="282" height="74" rx="4" fill="#ffffff" stroke="#e0b0aa"/>
  <text x="138" y="551" class="tiny">人物设定</text>
  <text x="138" y="575" class="tiny">姓名：……  性格：……</text>
  <rect x="420" y="524" width="294" height="74" rx="4" fill="#ffffff" stroke="#e0b0aa"/>
  <text x="436" y="551" class="tiny">世界观设定</text>
  <text x="436" y="575" class="tiny">规则：……  禁忌：……</text>
  <path d="M410 514 L410 718" class="dash"/>
  <text x="122" y="700" class="tiny">内容区高度不足，框体被迫并排压缩</text>

  <rect x="98" y="762" width="644" height="125" rx="5" class="bad"/>
  <text x="122" y="792" class="label">固定生成日志 + 进度条</text>
  <text x="122" y="820" class="small">持续占据页面底部，生成后仍保留空白高度</text>
  <rect x="122" y="843" width="560" height="13" rx="6" fill="#e0c1a5"/>
  <rect x="122" y="843" width="330" height="13" rx="6" fill="#c7792d"/>
  <text x="600" y="855" class="tiny">72%</text>

  <path d="M790 510 C830 510 830 510 870 510" class="line" marker-end="url(#arrow)"/>
  <text x="791" y="484" class="small">释放两行固定空间</text>
  <text x="791" y="535" class="small">状态改为按需打开</text>

  <rect x="870" y="125" width="660" height="790" rx="8" class="panel"/>
  <rect x="870" y="125" width="660" height="58" rx="8" class="header"/>
  <text x="898" y="162" class="headerText">建议：两行控制区 + 居中状态弹窗</text>

  <rect x="898" y="208" width="604" height="58" rx="5" class="good"/>
  <text x="922" y="243" class="label">本层控制</text>
  <rect x="1034" y="222" width="145" height="30" rx="4" class="control"/>
  <text x="1050" y="243" class="tiny">智能体：解析师</text>
  <rect x="1190" y="222" width="145" height="30" rx="4" class="control"/>
  <text x="1204" y="243" class="tiny">SKILL：设定提取</text>
  <rect x="1346" y="222" width="135" height="30" rx="4" class="control"/>
  <text x="1360" y="243" class="tiny">模式：串行</text>

  <rect x="898" y="278" width="604" height="52" rx="5" class="control"/>
  <text x="922" y="310" class="small">已选择 SKILL</text>
  <rect x="1035" y="291" width="185" height="27" rx="14" fill="#dbeaf7" stroke="#9ebbd4"/>
  <text x="1051" y="309" class="tiny">设定提取 · ×</text>
  <rect x="1230" y="291" width="185" height="27" rx="14" fill="#dbeaf7" stroke="#9ebbd4"/>
  <text x="1246" y="309" class="tiny">角色关系 · ×</text>
  <text x="1435" y="309" class="tiny">第二行</text>

  <rect x="898" y="342" width="604" height="484" rx="5" class="content"/>
  <text x="922" y="378" class="label">设定工作区</text>
  <text x="922" y="406" class="small">层级名称移入面包屑/辅助提示，不再单独占行</text>

  <rect x="922" y="430" width="280" height="140" rx="5" fill="#ffffff" stroke="#afd0bc"/>
  <text x="944" y="464" class="label">人物设定</text>
  <text x="944" y="496" class="small">姓名：顾临川</text>
  <text x="944" y="524" class="small">身份：边城调查员</text>
  <text x="944" y="552" class="small">核心动机：寻找失踪的妹妹</text>
  <rect x="1222" y="430" width="256" height="140" rx="5" fill="#ffffff" stroke="#afd0bc"/>
  <text x="1244" y="464" class="label">世界观设定</text>
  <text x="1244" y="496" class="small">时代：雾海纪元</text>
  <text x="1244" y="524" class="small">规则：记忆会实体化</text>
  <text x="1244" y="552" class="small">禁忌：不可篡改原始记忆</text>

  <rect x="922" y="596" width="556" height="194" rx="5" fill="#ffffff" stroke="#afd0bc"/>
  <text x="944" y="632" class="label">生成结果</text>
  <text x="944" y="664" class="small">设定字段在宽松容器中自然换行，内容区可滚动。</text>
  <text x="944" y="694" class="small">长文本不会挤压顶部控制条，也不会被固定状态区覆盖。</text>
  <text x="944" y="750" class="tiny">未保存 · 点击保存后写入项目</text>

  <rect x="898" y="846" width="604" height="42" rx="5" fill="#f8fafc" stroke="#d1d9e2"/>
  <circle cx="924" cy="867" r="8" class="green"/>
  <text x="944" y="873" class="small">生成状态：已完成</text>
  <rect x="1328" y="854" width="154" height="26" rx="4" class="blue"/>
  <text x="1350" y="872" class="white">查看生成日志</text>

  <rect x="898" y="342" width="604" height="484" class="overlay"/>
  <rect x="1040" y="462" width="320" height="220" rx="8" fill="#ffffff" stroke="#9aaabd" stroke-width="2"/>
  <text x="1070" y="500" class="label">生成状态</text>
  <text x="1070" y="528" class="small">滚动日志</text>
  <rect x="1070" y="544" width="260" height="54" rx="4" fill="#f4f7fa" stroke="#d0d9e2"/>
  <text x="1084" y="565" class="tiny">S1 解析设定字段……</text>
  <text x="1084" y="586" class="tiny">S2 校验并整理……</text>
  <rect x="1070" y="612" width="260" height="12" rx="6" fill="#e0c1a5"/>
  <rect x="1070" y="612" width="174" height="12" rx="6" class="orange"/>
  <text x="1256" y="623" class="tiny">67%</text>
  <rect x="1238" y="642" width="92" height="26" rx="4" class="orange"/>
  <text x="1251" y="660" class="white">取消生成</text>

  <text x="70" y="958" class="subtitle">审核重点：第一行放三项控制，第二行保留已选 SKILL；日志与进度居中弹窗显示，不再固定挤压设定内容区。</text>
</svg>
