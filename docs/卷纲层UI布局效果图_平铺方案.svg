<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080">
  <defs>
    <style>
      .bg { fill: #f4f7f9; }
      .panel { fill: #ffffff; stroke: #d6dee6; stroke-width: 2; }
      .top { fill: #263342; }
      .title { fill: #ffffff; font: 700 24px Arial, "Microsoft YaHei", sans-serif; }
      .h1 { fill: #1e2a38; font: 700 25px Arial, "Microsoft YaHei", sans-serif; }
      .h2 { fill: #253445; font: 700 18px Arial, "Microsoft YaHei", sans-serif; }
      .text { fill: #526274; font: 400 16px Arial, "Microsoft YaHei", sans-serif; }
      .small { fill: #667587; font: 400 14px Arial, "Microsoft YaHei", sans-serif; }
      .tiny { fill: #718093; font: 400 12px Arial, "Microsoft YaHei", sans-serif; }
      .control { fill: #f7fafc; stroke: #cbd6e0; stroke-width: 2; }
      .readonly { fill: #eef3f6; stroke: #c2cfd9; stroke-width: 2; }
      .selected { fill: #e8f2f8; stroke: #a9c8dd; stroke-width: 2; }
      .chip { fill: #d4e8f4; stroke: #a2c6dc; stroke-width: 2; }
      .active { fill: #2e7d63; }
      .activeText { fill: #ffffff; font: 700 14px Arial, "Microsoft YaHei", sans-serif; }
      .btn { fill: #ffffff; stroke: #9fb7c8; stroke-width: 2; }
      .btnDanger { fill: #ffffff; stroke: #c98a8a; stroke-width: 2; }
      .rowline { stroke: #e0e6eb; stroke-width: 2; }
      .rowActive { fill: #f2f8f4; }
      .stateOk { fill: #2e7d63; font: 700 14px Arial, "Microsoft YaHei", sans-serif; }
      .stateEdit { fill: #a8862d; font: 700 14px Arial, "Microsoft YaHei", sans-serif; }
      .ta { fill: #fbfdfe; stroke: #cbd6e0; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1680" height="1080"/>
  <text x="70" y="55" class="h1">生成流水线 · 卷纲层布局效果图（平铺方案 V2）</text>
  <text x="70" y="84" class="text">审核重点：保留平铺列表，取消底部固定编辑区；点「编辑」在对应行下方展开编辑，保存/锁定随行走</text>

  <rect x="70" y="116" width="1540" height="870" rx="8" class="panel"/>
  <rect x="70" y="116" width="1540" height="58" rx="8" class="top"/>
  <text x="98" y="153" class="title">卷纲层</text>
  <text x="1480" y="153" class="small" fill="#dbe5ee">生成状态：待机</text>

  <text x="100" y="213" class="h2">本层控制</text>
  <rect x="228" y="184" width="285" height="46" rx="5" class="control"/>
  <text x="248" y="213" class="small">智能体选择</text>
  <text x="390" y="213" class="text">卷纲架构师⌄</text>
  <rect x="535" y="184" width="390" height="46" rx="5" class="control"/>
  <text x="555" y="213" class="small">SKILL 选择</text>
  <text x="705" y="213" class="text">添加卷纲 SKILL⌄</text>
  <rect x="947" y="184" width="255" height="46" rx="5" class="control"/>
  <text x="967" y="213" class="small">模式</text>
  <text x="1065" y="213" class="text">串行 chain⌄</text>
  <rect x="1225" y="184" width="150" height="46" rx="5" class="active"/>
  <text x="1257" y="213" class="activeText">生成卷纲</text>

  <rect x="100" y="250" width="1478" height="54" rx="5" class="selected"/>
  <text x="124" y="283" class="h2">已选择 SKILL</text>
  <rect x="308" y="264" width="200" height="28" rx="14" class="chip"/>
  <text x="327" y="283" class="small">卷纲解析 · ×</text>
  <rect x="528" y="264" width="200" height="28" rx="14" class="chip"/>
  <text x="547" y="283" class="small">卷纲推演 · ×</text>
  <rect x="748" y="264" width="200" height="28" rx="14" class="chip"/>
  <text x="767" y="283" class="small">卷纲填充 · ×</text>
  <text x="1240" y="283" class="tiny">可拖动排序 · 每个 SKILL 可绑定独立智能体</text>

  <text x="100" y="353" class="h2">字数分配</text>
  <rect x="228" y="324" width="320" height="46" rx="5" class="readonly"/>
  <text x="248" y="353" class="small">总字数（大纲锁定）</text>
  <text x="420" y="353" class="text">500 万字（只读）</text>
  <rect x="568" y="324" width="180" height="46" rx="5" class="control"/>
  <text x="588" y="353" class="small">卷数</text>
  <text x="650" y="353" class="text">7（唯一输入）</text>
  <text x="770" y="353" class="small">每卷字数由 AI 按总字数与卷数共同分配，应用不做固定切分</text>
  <text x="228" y="392" class="tiny">（原「每卷字数」固定输入框移除；上限 20 卷，超出给明确提示，不再静默截断）</text>

  <text x="100" y="416" class="h2">卷纲列表（平铺行，非卡片）</text>
  <text x="110" y="440" class="tiny">序号</text>
  <text x="150" y="440" class="tiny">卷名</text>
  <text x="370" y="440" class="tiny">纲要摘要</text>
  <text x="1000" y="440" class="tiny">AI分配字数</text>
  <text x="1130" y="440" class="tiny">状态</text>
  <text x="1230" y="440" class="tiny">操作</text>

  <rect x="90" y="450" width="1500" height="52" class="rowActive"/>
  <text x="110" y="482" class="text">1</text>
  <text x="150" y="482" class="text">第一卷 · 风起于青萍</text>
  <text x="370" y="482" class="small">古镜传承现世，北境少年踏入修行，卷末突破凝元……</text>
  <text x="1000" y="482" class="text">71.5 万字</text>
  <text x="1130" y="482" class="stateOk">已绑定 ✓</text>
  <rect x="1230" y="460" width="110" height="32" rx="5" class="btn"/>
  <text x="1247" y="481" class="small">解除绑定</text>
  <rect x="1350" y="460" width="64" height="32" rx="5" class="btn"/>
  <text x="1367" y="481" class="small">编辑</text>
  <rect x="1424" y="460" width="64" height="32" rx="5" class="btnDanger"/>
  <text x="1441" y="481" class="small">删除</text>

  <line x1="90" y1="504" x2="1590" y2="504" class="rowline"/>
  <text x="110" y="538" class="text">2</text>
  <text x="150" y="538" class="text">第二卷 · 云涌九霄</text>
  <text x="370" y="538" class="small">中原门派大会，古镜秘密初显，主角崭露头角……</text>
  <text x="1000" y="538" class="text">71.4 万字</text>
  <text x="1130" y="538" class="stateEdit">已锁定</text>
  <rect x="1230" y="516" width="110" height="32" rx="5" class="active"/>
  <text x="1240" y="537" class="activeText">绑定到章节层</text>
  <rect x="1350" y="516" width="64" height="32" rx="5" class="btn"/>
  <text x="1367" y="537" class="small">编辑</text>
  <rect x="1424" y="516" width="64" height="32" rx="5" class="btnDanger"/>
  <text x="1441" y="537" class="small">删除</text>

  <line x1="90" y1="560" x2="1590" y2="560" class="rowline"/>
  <text x="110" y="594" class="text">3</text>
  <text x="150" y="594" class="text">第三卷 · 雷泽暗流</text>
  <text x="370" y="594" class="small">暂无纲要</text>
  <text x="1000" y="594" class="text">—</text>
  <text x="1130" y="594" class="stateEdit">编辑中</text>
  <rect x="1230" y="572" width="110" height="32" rx="5" class="btn"/>
  <text x="1240" y="593" class="small">锁定并绑定</text>
  <rect x="1350" y="572" width="64" height="32" rx="5" class="btn"/>
  <text x="1367" y="593" class="small">收起</text>
  <rect x="1424" y="572" width="64" height="32" rx="5" class="btnDanger"/>
  <text x="1441" y="593" class="small">删除</text>

  <rect x="90" y="620" width="1500" height="172" rx="5" class="rowActive"/>
  <text x="110" y="650" class="small">第三卷 · 行内编辑展开（替代原底部固定编辑区，一次只展开一卷）</text>
  <rect x="228" y="664" width="300" height="40" rx="5" class="control"/>
  <text x="248" y="690" class="small">卷名</text>
  <text x="360" y="690" class="text">第三卷 · 雷泽暗流</text>
  <rect x="548" y="664" width="420" height="40" rx="5" class="control"/>
  <text x="568" y="690" class="small">摘要</text>
  <text x="640" y="690" class="text">雷泽秘境异动，旧案线索重现</text>
  <rect x="228" y="714" width="1050" height="52" rx="5" class="ta"/>
  <text x="248" y="736" class="small">卷纲要：雷泽水位连年下降，露出前朝祭坛；主角循古镜指引进入秘境，</text>
  <text x="248" y="756" class="small">发现百年前宗门覆灭真相的一角，卷末遭同门暗算跌落渊底。</text>
  <rect x="1300" y="714" width="180" height="40" rx="5" class="active"/>
  <text x="1315" y="740" class="activeText">保存并锁定本卷</text>
  <text x="1300" y="780" class="tiny">锁定后只读 · 解除绑定后可再改</text>

  <line x1="90" y1="796" x2="1590" y2="796" class="rowline"/>
  <text x="110" y="830" class="tiny">4</text>
  <text x="150" y="830" class="tiny">待生成</text>
  <text x="370" y="830" class="tiny">AI 将按总字数与剧情节奏分配本卷字数</text>
  <text x="1000" y="830" class="tiny">—</text>
  <text x="1130" y="830" class="tiny">未生成</text>
  <line x1="90" y1="846" x2="1590" y2="846" class="rowline"/>
  <text x="110" y="880" class="tiny">5</text>
  <text x="150" y="880" class="tiny">待生成</text>
  <text x="370" y="880" class="tiny">…</text>
  <text x="1000" y="880" class="tiny">—</text>
  <text x="1130" y="880" class="tiny">未生成</text>
  <line x1="90" y1="896" x2="1590" y2="896" class="rowline"/>
  <text x="100" y="920" class="tiny">共 7 卷 · 列表可滚动 · 同时只展开一卷编辑 · 生成后自动回填卷名 / 纲要 / 分配字数</text>

  <rect x="100" y="936" width="170" height="44" rx="5" class="active"/>
  <text x="126" y="964" class="activeText">AI生成全卷</text>
  <rect x="290" y="936" width="150" height="44" rx="5" class="btn"/>
  <text x="322" y="964" class="small">逐卷生成</text>
  <rect x="460" y="936" width="190" height="44" rx="5" class="btn"/>
  <text x="480" y="964" class="small">确认完成下一步</text>
  <text x="700" y="964" class="tiny">生成时：进度与日志改为居中弹窗（滚动日志 + 进度条 + 取消生成）</text>
  <text x="1330" y="964" class="small">绑定后 → 章节层按已绑定卷生成章节</text>
</svg>
